[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "copercitrus-price-collector"
version = "0.2.0"
description = "RPA de precos do Google Shopping e Shopee a partir de planilhas Excel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "IAgentics" }]
dependencies = [
  "openpyxl>=3.1,<4",
  "playwright==1.61.0",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
]

[project.scripts]
copercitrus-price = "copercitrus_price_collector.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
