[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "copercitrus-price-collector"
version = "0.2.0"
description = "RPA de precos do Google Shopping e Shopee a partir de planilhas Excel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "IAgentics" }]
dependencies = [
  "openpyxl>=3.1,<4",
  "playwright==1.61.0",
]

[project.scripts]
copercitrus-price = "copercitrus_price_collector.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
